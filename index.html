<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXUS Gear — Vitrine Gamer</title>
<style>
/* ===================== CSS ===================== */
:root{
  color-scheme: dark;
  --bg:#0e1013; --surface:#16191e; --surface-2:#1c2026; --line:#2a2f37;
  --text:#e7e9ec; --muted:#8d949f;
  --accent:#d6453d; --accent-h:#b93832; --ok:#5fb37c; --warn:#d9a441; --danger:#d9534f;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:2px;font-size:1.2rem}
.logo span{color:var(--accent)}
.search{flex:1;min-width:200px}
.search input,.filter select{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.95rem;outline:none}
.search input:focus,.filter select:focus{border-color:var(--muted)}
.filter select{min-width:180px}
.cart-btn{position:relative;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;cursor:pointer;transition:.15s}
.cart-btn:hover{border-color:var(--accent)}
.badge{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;border-radius:99px;font-size:.72rem;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}

.hero{padding:44px 0 8px}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.6rem);margin:0 0 8px;line-height:1.15;font-weight:700}
.hero p{color:var(--muted);max-width:560px;margin:0}
h2.sec{font-size:1.1rem;margin:34px 0 14px;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;transition:.15s;position:relative}
.card:hover{border-color:#444b57}
.thumb{aspect-ratio:1/1;border-radius:8px;background:#fff;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.card.out .thumb img{filter:grayscale(1);opacity:.55}
.tag{align-self:flex-start;font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;padding:3px 9px;border-radius:4px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.card h3{margin:0;font-size:1rem;line-height:1.3;font-weight:600}
.pid{font-family:ui-monospace,Consolas,monospace;font-size:.75rem;color:var(--muted)}
.price{font-size:1.4rem;font-weight:700}
.stock{font-size:.82rem}
.stock.ok{color:var(--ok)} .stock.low{color:var(--warn)} .stock.none{color:var(--danger);font-weight:600}
.add{margin-top:auto;padding:10px;border-radius:8px;border:0;cursor:pointer;font-weight:600;font-size:.92rem;background:var(--accent);color:#fff;transition:.15s}
.add:hover:not(:disabled){background:var(--accent-h)}
.add:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.ribbon{position:absolute;top:22px;left:22px;background:var(--bg);color:var(--text);font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;border:1px solid var(--line)}
.empty{color:var(--muted);padding:30px 0;text-align:center;grid-column:1/-1}

.overlay{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:.3s;z-index:31;display:flex;flex-direction:column;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.drawer-head h2{margin:0;font-size:1.15rem}
.x{background:none;border:0;color:var(--muted);font-size:1.5rem;cursor:pointer}
.items{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.item{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px}
.item b{font-size:.92rem}
.item .row{display:flex;justify-content:space-between;align-items:center}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer}
.qty button:hover{border-color:var(--muted)}
.rm{background:none;border:0;color:var(--danger);cursor:pointer;font-size:.8rem}
.total{display:flex;justify-content:space-between;font-size:1.15rem;font-weight:700;padding:14px 0;border-top:1px solid var(--line)}
.checkout{padding:12px;border-radius:8px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;font-size:1rem}
.checkout:hover:not(:disabled){background:var(--accent-h)}
.checkout:disabled{background:var(--surface-2);color:var(--muted);cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--surface-2);border:1px solid var(--line);padding:12px 20px;border-radius:8px;opacity:0;transition:.3s;z-index:40;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{margin:50px 0 30px;text-align:center;color:var(--muted);font-size:.82rem}
@media(max-width:560px){.filter select{min-width:0}.filter{flex:1}}
</style>
</head>
<body>

<!-- ===================== HTML ===================== -->
<header>
  <div class="wrap bar">
    <div class="logo">NEXUS<span>GEAR</span></div>
    <div class="search"><input id="busca" type="search" placeholder="Buscar produto ou código (ex.: PER-88421)…" aria-label="Buscar produtos"></div>
    <div class="filter"><select id="categoria" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select></div>
    <button class="cart-btn" id="abrirCarrinho" aria-label="Abrir carrinho">Carrinho <span class="badge" id="contador">0</span></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Monte o seu setup</h1>
    <p>Periféricos, placas de vídeo e componentes. Catálogo carregado via API em JSON.</p>
  </section>

  <h2 class="sec">Destaques</h2>
  <div class="grid" id="destaques"></div>

  <h2 class="sec">Todos os produtos</h2>
  <div class="grid" id="vitrine"></div>
</main>

<footer>© 2026 NEXUS GEAR — Projeto de demonstração</footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Carrinho de compras">
  <div class="drawer-head"><h2>Seu carrinho</h2><button class="x" id="fechar" aria-label="Fechar">×</button></div>
  <div class="items" id="itens"></div>
  <div class="total"><span>Total</span><span id="total">R$ 0,00</span></div>
  <button class="checkout" id="finalizar" disabled>Finalizar compra</button>
</aside>
<div class="toast" id="toast" role="status"></div>

// 2) Simula GET /api/produtos: devolve TEXTO JSON após uma latência de rede
function fetchProdutos(){
  return new Promise(resolve => setTimeout(() => resolve(JSON.stringify(BANCO)), 400));
  // Em produção: return fetch("/api/produtos").then(r => r.json());
}

// Estado
let produtos = [];
const carrinho = new Map();   // id -> quantidade

const $ = s => document.querySelector(s);
const moeda = v => v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc = t => String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 3) Renderização dinâmica dos cards a partir do JSON
function statusEstoque(stock){
  if (stock === 0) return { cls:"none", txt:"Esgotado" };
  if (stock <= 5)  return { cls:"low",  txt:`Últimas ${stock} unidades` };
  return { cls:"ok", txt:`${stock} em estoque` };
}

function cardHTML(p, destaque){
  const s = statusEstoque(p.stock);
  const esgotado = p.stock === 0;
  return `
  <article class="card ${esgotado ? "out" : ""}">
    ${destaque ? '<div class="ribbon">Destaque</div>' : ""}
    <div class="thumb"><img src="${IMAGENS[p.id] || ''}" alt="${esc(p.produto)}" loading="lazy"></div>
    <span class="tag">${esc(p.categoria)}</span>
    <h3>${esc(p.produto)}</h3>
    <span class="pid">Cód.: ${esc(p.id)}</span>
    <div class="price">${moeda(p.preco)}</div>
    <div class="stock ${s.cls}">${s.txt}</div>
    <button class="add" data-id="${esc(p.id)}" ${esgotado ? "disabled" : ""}>
      ${esgotado ? "Esgotado" : "Adicionar ao carrinho"}
    </button>
  </article>`;
}

function renderVitrine(){
  const termo = $("#busca").value.trim().toLowerCase();
  const cat = $("#categoria").value;
  const lista = produtos.filter(p =>
    (!cat || p.categoria === cat) &&
    (!termo || p.produto.toLowerCase().includes(termo) || p.id.toLowerCase().includes(termo))
  );
  $("#vitrine").innerHTML = lista.length
    ? lista.map(p => cardHTML(p,false)).join("")
    : '<div class="empty">Nenhum produto encontrado.</div>';
}

function renderDestaques(){
  // Destaques: os 3 itens disponíveis de maior preço
  const top = produtos.filter(p => p.stock > 0).sort((a,b) => b.preco - a.preco).slice(0,3);
  $("#destaques").innerHTML = top.map(p => cardHTML(p,true)).join("");
}

function preencherCategorias(){
  [...new Set(produtos.map(p => p.categoria))].forEach(c => {
    const o = document.createElement("option");
    o.value = c; o.textContent = c;
    $("#categoria").appendChild(o);
  });
}

// 4) Carrinho — valida stock > 0 antes de adicionar
function adicionarAoCarrinho(id){
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  if (p.stock <= 0) return toast("Produto esgotado.");
  const atual = carrinho.get(id) || 0;
  if (atual + 1 > p.stock) return toast(`Limite de estoque atingido (${p.stock}).`);
  carrinho.set(id, atual + 1);
  toast(`${p.produto} adicionado!`);
  renderCarrinho();
}

function alterarQtd(id, delta){
  const p = produtos.find(x => x.id === id);
  const nova = (carrinho.get(id) || 0) + delta;
  if (nova <= 0) carrinho.delete(id);
  else if (nova > p.stock) return toast(`Limite de estoque atingido (${p.stock}).`);
  else carrinho.set(id, nova);
  renderCarrinho();
}

function calcularTotal(){
  let total = 0;
  carrinho.forEach((qtd, id) => { total += produtos.find(p => p.id === id).preco * qtd; });
  return Math.round(total * 100) / 100;
}

function renderCarrinho(){
  let qtdTotal = 0;
  const html = [...carrinho].map(([id, qtd]) => {
    const p = produtos.find(x => x.id === id);
    qtdTotal += qtd;
    return `<div class="item">
      <b>${esc(p.produto)}</b>
      <div class="row"><span class="pid">${esc(p.id)}</span><span>${moeda(p.preco * qtd)}</span></div>
      <div class="row">
        <div class="qty">
          <button data-act="menos" data-id="${esc(id)}" aria-label="Diminuir">−</button>
          <span>${qtd}</span>
          <button data-act="mais" data-id="${esc(id)}" aria-label="Aumentar">+</button>
        </div>
        <button class="rm" data-act="rm" data-id="${esc(id)}">Remover</button>
      </div></div>`;
  }).join("");
  $("#itens").innerHTML = html || '<div class="empty">Seu carrinho está vazio.</div>';
  $("#contador").textContent = qtdTotal;
  $("#total").textContent = moeda(calcularTotal());
  $("#finalizar").disabled = carrinho.size === 0;
}

// 5) Checkout: monta o JSON que seria enviado via POST /api/pedidos
function finalizarCompra(){
  const pedido = {
    itens: [...carrinho].map(([id, quantidade]) => ({ id, quantidade })),
    total: calcularTotal()
  };
  console.log("POST /api/pedidos", JSON.stringify(pedido, null, 2));
  // Simulação: o servidor abate o estoque
  carrinho.forEach((qtd, id) => { produtos.find(p => p.id === id).stock -= qtd; });
  carrinho.clear();
  renderCarrinho(); renderVitrine(); renderDestaques();
  alternarCarrinho(false);
  toast("Pedido enviado! Veja o JSON no console.");
}

// UI auxiliar
function alternarCarrinho(abrir){
  $("#drawer").classList.toggle("open", abrir);
  $("#overlay").classList.toggle("open", abrir);
}
let tTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tTimer); tTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// Eventos
document.addEventListener("click", e => {
  const add = e.target.closest(".add");
  if (add) return adicionarAoCarrinho(add.dataset.id);
  const b = e.target.closest("[data-act]");
  if (!b) return;
  if (b.dataset.act === "mais") alterarQtd(b.dataset.id, 1);
  if (b.dataset.act === "menos") alterarQtd(b.dataset.id, -1);
  if (b.dataset.act === "rm") { carrinho.delete(b.dataset.id); renderCarrinho(); }
});
$("#busca").addEventListener("input", renderVitrine);
$("#categoria").addEventListener("change", renderVitrine);
$("#abrirCarrinho").addEventListener("click", () => alternarCarrinho(true));
$("#fechar").addEventListener("click", () => alternarCarrinho(false));
$("#overlay").addEventListener("click", () => alternarCarrinho(false));
$("#finalizar").addEventListener("click", finalizarCompra);

// Inicialização: consome a "API", faz o parse do JSON e renderiza
(async function init(){
  $("#vitrine").innerHTML = '<div class="empty">Carregando produtos…</div>';
  try {
    const texto = await fetchProdutos();   // resposta HTTP (texto)
    produtos = JSON.parse(texto);          // texto -> array de objetos
    preencherCategorias();
    renderDestaques();
    renderVitrine();
    renderCarrinho();
  } catch (err) {
    $("#vitrine").innerHTML = '<div class="empty">Erro ao carregar produtos.</div>';
    console.error(err);
  }
})();
</script>
